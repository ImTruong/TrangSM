# ===============================
# APP
# ===============================
spring.application.name=auth-service
server.port=5000

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-db:5432/auth_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# SERVER THREAD
# ===============================
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.data.redis=INFO
# ===============================
# KEYCLOAK
# ===============================
keycloak.auth-server-url=http://keycloak-server:8080
keycloak.realm=trang-sm
keycloak.resource=auth-service
keycloak.credentials.secret=my-client-secret
