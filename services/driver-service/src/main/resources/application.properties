# ===============================
# APP
# ===============================
spring.application.name=driver-service
server.port=5000

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-db:5432/driver_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# KAFKA
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka-server:29092}
spring.kafka.consumer.group-id=driver-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.kafka=INFO
