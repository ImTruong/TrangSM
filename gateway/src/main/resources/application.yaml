server:
  port: 8000

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:5000        # lb:// nếu dùng Discovery Service, hoặc http://localhost:8081
          predicates:
            - Path=/api/auth, /api/auth/**
          filters:
            - RewritePath=/api/auth(?<segment>.*), /api/v1/auth$\{segment}

        - id: booking-service
          uri: http://booking-service:5000
          predicates:
            - Path=/api/bookings, /api/bookings/**
          filters:
            - RewritePath=/api/bookings(?<segment>.*), /api/v1/bookings$\{segment}

        - id: user-service
          uri: http://user-service:5000
          predicates:
            - Path=/api/user, /api/user/**
          filters:
            - RewritePath=/api/user(?<segment>.*), /api/v1/user$\{segment}

        - id: driver-service
          uri: http://driver-service:5000
          predicates:
            - Path=/api/driver, /api/driver/**
          filters:
            - RewritePath=/api/driver(?<segment>.*), /api/v1/drivers$\{segment}

        - id: vehicle-service
          uri: http://vehicle-service:5000
          predicates:
            - Path=/api/vehicle, /api/vehicle/**
          filters:
            - RewritePath=/api/vehicle(?<segment>.*), /api/v1/vehicles$\{segment}

#        - id: trip-service
#          uri: http://trip-service:5000
#          predicates:
#            - Path=/api/trip/**
#          filters:
#            - RewritePath=/api/trip/(?<segment>.*), /api/v1/trip/$\{segment}

        - id: payment-service
          uri: http://payment-service:5000
          predicates:
            - Path=/api/payment, /api/payment/**
          filters:
            - RewritePath=/api/payment(?<segment>.*), /api/v1/payment$\{segment}

        - id: location-service
          uri: http://location-service:5000
          predicates:
            - Path=/api/location, /api/location/**
          filters:
            - RewritePath=/api/location(?<segment>.*), /api/v1/location$\{segment}

        - id: notification-service
          uri: http://notification-service:5000
          predicates:
            - Path=/api/notification, /api/notification/**
          filters:
            - RewritePath=/api/notification(?<segment>.*), /api/v1/notifications$\{segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Nơi Gateway lấy Public Key để decode token
          jwk-set-uri: http://keycloak-server:8080/realms/trang-sm/protocol/openid-connect/certs
