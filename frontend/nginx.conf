server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Booking service (orchestrator)
    location /api/bookings {
        proxy_pass http://booking-service:5000/api/v1/bookings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vehicle service
    location /api/vehicles/types {
        proxy_pass http://vehicle-service:5000/api/v1/vehicles/types;
        proxy_set_header Host $host;
    }

    location /api/vehicles/by-owner {
        proxy_pass http://vehicle-service:5000/api/v1/vehicles/by-owner;
        proxy_set_header Host $host;
    }

    # Payment service
    location /api/payment/methods {
        proxy_pass http://payment-service:5000/api/v1/payment/methods;
        proxy_set_header Host $host;
    }

    # Health checks for quick diagnostics from UI
    location /api/health/booking {
        proxy_pass http://booking-service:5000/health;
    }

    location /api/health/vehicle {
        proxy_pass http://vehicle-service:5000/health;
    }

    location /api/health/payment {
        proxy_pass http://payment-service:5000/health;
    }
}

