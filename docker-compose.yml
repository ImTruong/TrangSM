# Docker Compose — Multi-container orchestration
# Run: docker compose up --build
# Docs: https://docs.docker.com/compose/

services:
  # ─── Frontend ────────────────────────────────────
  #  frontend:
  #    build: ./frontend
  #    ports:
  #      - "${FRONTEND_PORT:-3000}:3000"
  #    depends_on:
  #      - gateway
  #    networks:
  #      - app-network
  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    depends_on:
      - booking-service
      - location-service
      - auth-service
      - driver-service
      - notification-service
      - user-service
      - vehicle-service
    networks:
      - trang-sm

  # ─── Location Service ───────────────────────────────────
  location-service:
    build: ./services/location-service
    ports:
      - "${LOCATION_SERVICE_PORT:-8087}:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  user-service:
    build: ./services/user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  driver-service:
    build: ./services/driver-service
    ports:
      - "${DRIVER_SERVICE_PORT:-8083}:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  vehicle-service:
    build: ./services/vehicle-service
    ports:
      - "${VEHICLE_SERVICE_PORT:-8084}:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  notification-service:
    build: ./services/notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8088}:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  auth-service:
    build: ./services/auth-service
    ports:
      - "8180:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  trip-service:
    build: ./services/trip-service
    ports:
      - "${TRIP_SERVICE_PORT:-8085}:5000"
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - trang-sm

  payment-service:
    build: ./services/payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8086}:5000"
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - trang-sm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  booking-service:
    build: ./services/booking-service
    ports:
      - "${BOOKING_SERVICE_PORT:-8081}:5000"
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - trang-sm

  booking-service:
    build: ./services/booking-service
    ports:
      - "${BOOKING_SERVICE_PORT:-8081}:5000"
    env_file:
      - .env
    depends_on:
      - db
      - kafka
    networks:
      - trang-sm

  # ─── Shared Infrastructure (uncomment as needed) ─
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - trang-sm

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - trang-sm

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - trang-sm

  kafka:
    image: apache/kafka:latest
    container_name: kafka-server
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka-server:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-server:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - trang-sm

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8002:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-server:29092
    networks:
      - trang-sm

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak-server
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm.json:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-root}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8003:8080"
    networks:
      - trang-sm

networks:
  trang-sm:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redis_insight_data:
    driver: local
