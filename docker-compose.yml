    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # ─── Location Service ───────────────────────────────────
  location-service:
    build: ./services/location-service
    ports:
      - "8081:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  user-service:
    build: ./services/user-service
    ports:
      - "8082:5000"
    env_file:
      - .env
    networks:
      - trang-sm

  # ─── Shared Infrastructure (uncomment as needed) ─
  db:
    image: postgres:16-alpine    # or mysql:8, mongo:7, etc.
    container_name: postgres-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      #       POSTGRES_DB: ${DB_NAME:-mydb}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - trang-sm

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - trang-sm

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - trang-sm

  kafka:
    image: apache/kafka:latest
    container_name: kafka-server
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      # Listener nội bộ dùng cổng 29092, Listener cho máy thật dùng cổng 9092
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka-server:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=DOCKER
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-server:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - trang-sm

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-server:29092
    networks:
      - trang-sm

networks:
  trang-sm:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  redis_insight_data:
    driver: local
