# ============================================
# Auth Service — OpenAPI 3.0 Specification
# Port: 5000
# ============================================
openapi: 3.0.3
info:
  title: Auth Service API
  description: |
    Quản lý xác thực và ủy quyền người dùng.
    Hỗ trợ đăng nhập qua Keycloak và kiểm tra sức khỏe service.
  version: 1.0.0

servers:
  - url: http://localhost:8180
    description: Local development

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái hoạt động của service
      operationId: getHealth
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      summary: Đăng nhập người dùng và nhận Access Token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token
          content:
            application/json:
              schema:
                type: string
                description: Access Token (JWT)
                example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Sai thông tin đăng nhập hoặc không có quyền
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Account not found or Wrong password"

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          description: Số điện thoại dùng để đăng nhập
          example: "0123456789"
        password:
          type: string
          description: Mật khẩu đăng nhập
          format: password
          example: "123456"
