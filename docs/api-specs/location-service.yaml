# ============================================
# Location Service — OpenAPI 3.0 Specification
# Port: 5000
# ============================================
openapi: 3.0.3
info:
  title: Location Service API
  description: |
    Quản lý tọa độ thời gian thực và tìm kiếm tài xế lân cận.
    Utility Service sử dụng Redis GEO để tối ưu hóa truy vấn không gian.
  version: 1.0.0

servers:
  - url: http://localhost:8087
    description: Local development

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái hoạt động của service
      operationId: getHealth
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/location/update:
    post:
      summary: Cập nhật vị trí và trạng thái của tài xế
      operationId: updateLocation
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-User-Name
          in: header
          required: true
          schema:
            type: string
        - name: X-User-Roles
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Cập nhật thành công
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /api/v1/location/nearby:
    get:
      summary: Tìm kiếm tài xế gần nhất trong bán kính
      operationId: getClosestDriver
      parameters:
        - name: requestId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: ID của request

        - name: radiusKm
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Bán kính tìm kiếm (km)

        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Kinh độ (longitude)

        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Vĩ độ (latitude)

        - name: vehicleTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: ID loại xe
      responses:
        '200':
          description: Tìm thấy tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyDriver'
        '404':
          description: Không tìm thấy tài xế nào trong bán kính tìm kiếm

components:
  schemas:
    LocationRequest:
      type: object
      required:
        - driverId
        - vehicleTypeId
        - lng
        - lat
        - status
      properties:
        driverId:
          type: integer
          format: int64
        vehicleTypeId:
          type: integer
          format: int64
        lng:
          type: number
          format: decimal
          example: 105.8342
        lat:
          type: number
          format: decimal
          example: 21.0285
        status:
          type: string
          description: "Trạng thái tài xế (VD: available, busy)"
          example: "available"

    NearbyRequest:
      type: object
      required:
        - requestId
        - radiusKm
        - limit
        - lng
        - lat
        - vehicleTypeId
      properties:
        requestId:
          type: integer
          format: int64
        radiusKm:
          type: number
          format: double
          example: 5.0
        limit:
          type: integer
          example: 10
        lng:
          type: number
          format: decimal
          example: 105.8342
        lat:
          type: number
          format: decimal
          example: 21.0285
        vehicleTypeId:
          type: integer
          format: int64

    NearbyDriver:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        lng:
          type: number
          format: decimal
        lat:
          type: number
          format: decimal
