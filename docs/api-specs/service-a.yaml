# ============================================
# User Service — OpenAPI 3.0 Specification
# Port: 8082
# ============================================
openapi: 3.0.3
info:
  title: User Service API
  description: |
    Quản lý thông tin cá nhân của Khách hàng.
    Entity Service — Agnostic Logic, tái dùng được ở mọi process.
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /users/{id}:
    get:
      summary: Truy xuất thông tin cá nhân của Khách hàng
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của Khách hàng
      responses:
        '200':
          description: Trả về thông tin Khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ID không đúng định dạng UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy Khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        fullName:
          type: string
          example: "Nguyen Van A"
        phone:
          type: string
          example: "0901234567"
        avatarUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/avatars/a1b2c3d4.jpg"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "User not found"